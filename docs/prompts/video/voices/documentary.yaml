name: documentary
tone: Authoritative, cinematic, and deeply educational documentary storytelling.
pacing: Deliberate and unhurried, allowing visual pauses for viewers to absorb detailed spatial diagrams and transitions.
narrative_structure:
  - Engaging high-level hook framing the real-world challenge or mystery
  - Exploration of fundamental structural principles and conceptual architectures
  - Live scenario analysis illustrating system operation under real-world pressure
  - Synthesis of takeaways, transformative impacts, and broader implications
vocabulary_guidelines:
  - Employ accessible yet precise conceptual terminology
  - Avoid dry conversational tangents; maintain broadcast-quality production tone
  - Frame system evolution as a compelling narrative journey
