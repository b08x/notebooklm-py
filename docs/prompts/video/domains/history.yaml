name: history
description: Historical movements, civilizational transformations, and geopolitical institutional dynamics.
concept_mapping:
  dynasty: monumental architectural citadel evolving across centuries of expansion and consolidation
  revolution: tectonic geopolitical eruption fracturing legacy structural institutions
  treatise: authoritative constitutional charter cementing legal rights and ideological mandates
  trade network: vital continental arterial silk highway exchanging resources and philosophical movements
  empire: expansive imperial network of tributary provinces anchored by central command outposts
domain_rules:
  - Anchor abstract political changes to tangible geographical transformations and human geography
  - Illustrate the passage of decades and centuries through evolving architectural styles and borders
  - Highlight the tension between established institutional authority and insurgent grassroots movements
